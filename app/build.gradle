plugins {
    alias(libs.plugins.android.application)
}

// ===== 版本号：versionCode=提交次数，versionName=构建时间(UTC+8 精确到秒) =====
def gitCommitCount() {
    try {
        def p = "git rev-list --count HEAD".execute(null, rootProject.projectDir)
        def count = p.text.trim()
        p.waitFor()
        return count.isInteger() ? count : "1"
    } catch (Exception e) {
        return "1"
    }
}

def buildTime() {
    def fmt = new java.text.SimpleDateFormat("yyyyMMddHHmmss", java.util.Locale.ROOT)
    fmt.setTimeZone(java.util.TimeZone.getTimeZone("Asia/Shanghai"))
    return fmt.format(new Date())
}

def versionCodeVal = (System.getenv("TSS_VERSION_CODE") ?: gitCommitCount()).toInteger()
def versionNameVal = System.getenv("TSS_VERSION_NAME") ?: buildTime()

android {
    namespace 'com.dszsu.tss'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.dszsu.tss"
        minSdk 29
        targetSdk 36
        versionCode versionCodeVal
        versionName versionNameVal

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
dependencies {
    compileOnly libs.api
}
dependencies {
    implementation libs.swiperefreshlayout
    implementation(libs.service)
}